infrastructure_constraints = "The minimal canonical-result verification uses the claims/*/run.py Python verifiers, which are platform-independent and require only a Python 3 runtime plus the Python standard library; they do not require Linux, a GPU, CUDA, or prepared datasets. The provided run.sh wrappers use Bash and document a Linux execution environment. Optional scaled/full research-code reproduction requires an NVIDIA GPU and CUDA-enabled PyTorch because the DP noise path calls .cuda() unconditionally; full FEMNIST end-to-end training additionally requires locally prepared LEAF FEMNIST data, which is not bundled. The validated reference environment is 2 x NVIDIA RTX 3080, an Intel Core i7-12700K CPU, and 64 GB RAM, and is not a minimum requirement for canonical-result verification."

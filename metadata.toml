use = "The artifact is intended to reproduce and inspect the GMSA aggregation and detection workflow against Model Shuffle Attacks in differentially private federated learning. It is primarily intended for research and evaluation of the claims described in the accompanying artifact documentation. The bundled verification uses canonical experiment results for consistency checks rather than claiming full end-to-end retraining reproduction. Minimal canonical-result verification runs via the claims/*/run.py Python verifiers, which do not require Linux, a GPU, CUDA, or prepared datasets; the provided .sh wrappers assume a Linux Bash environment. Optional scaled/full research-code reproduction requires an NVIDIA GPU and CUDA-enabled PyTorch; full FEMNIST end-to-end training additionally requires locally prepared LEAF FEMNIST data, which is not bundled. The artifact is not intended as a general-purpose federated learning framework or production deployment."
